<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow01" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="20" fill="url(#bg01)"/>
  <rect x="1" y="1" width="798" height="478" rx="19" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Category Header Badge -->
  <rect x="40" y="36" width="104" height="26" rx="13" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3"/>
  <text x="92" y="53" fill="#f97316" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">CATEGORY 01</text>
  
  <text x="40" y="92" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="800">凭证与卡券流体弹层 · 6款核心组件</text>
  <text x="40" y="116" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="13">26px 高斯毛玻璃浮起 · 1.2s 顺时针圆环 · 53周刻度扫动 · 180° 原地翻面凭证</text>

  <!-- Card 1: Frosted Glass Sheet Mockup -->
  <g transform="translate(40, 145)">
    <rect width="220" height="295" rx="18" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="60" height="18" rx="4" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="46" y="29" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">BLUR 26px</text>
    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">玻璃面板浮起</text>
    <text x="16" y="72" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="10">Frosted Glass Sheet</text>
    
    <!-- Giant Stat -->
    <text x="16" y="125" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="42" font-weight="900">163</text>
    <text x="100" y="112" fill="#f97316" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700">天剩余</text>
    <text x="16" y="142" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">年度会员权益打卡统计</text>

    <!-- Months Grid (12 capsules) -->
    <g transform="translate(16, 160)">
      <rect x="0" y="0" width="12" height="42" rx="6" fill="#334155"/><rect x="0" y="8" width="12" height="34" rx="6" fill="#f97316"/>
      <rect x="16" y="0" width="12" height="42" rx="6" fill="#334155"/><rect x="16" y="12" width="12" height="30" rx="6" fill="#f97316"/>
      <rect x="32" y="0" width="12" height="42" rx="6" fill="#334155"/><rect x="32" y="4" width="12" height="38" rx="6" fill="#f97316"/>
      <rect x="48" y="0" width="12" height="42" rx="6" fill="#334155"/><rect x="48" y="16" width="12" height="26" rx="6" fill="#f97316"/>
      <rect x="64" y="0" width="12" height="42" rx="6" fill="#334155"/><rect x="64" y="2" width="12" height="40" rx="6" fill="#f97316"/>
      <rect x="80" y="0" width="12" height="42" rx="6" fill="#334155"/><rect x="80" y="14" width="12" height="28" rx="6" fill="#f97316"/>
      <rect x="96" y="0" width="12" height="42" rx="6" fill="#334155"/>
      <rect x="112" y="0" width="12" height="42" rx="6" fill="#334155"/>
      <rect x="128" y="0" width="12" height="42" rx="6" fill="#334155"/>
      <rect x="144" y="0" width="12" height="42" rx="6" fill="#334155"/>
      <rect x="160" y="0" width="12" height="42" rx="6" fill="#334155"/>
      <rect x="176" y="0" width="12" height="42" rx="6" fill="#334155"/>
    </g>

    <!-- Bottom Action Pill -->
    <rect x="16" y="240" width="188" height="36" rx="18" fill="#f97316"/>
    <text x="110" y="263" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">查看完整行程 ➔</text>
  </g>

  <!-- Card 2: Ring Count Sheet Mockup -->
  <g transform="translate(290, 145)">
    <rect width="220" height="295" rx="18" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="66" height="18" rx="4" fill="#f97316" fill-opacity="0.15"/>
    <text x="49" y="29" fill="#f97316" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">RING 1.2s</text>
    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">圆环计数弹出</text>
    <text x="16" y="72" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="10">Ring Count Sheet</text>

    <!-- Circular Progress Ring Mockup -->
    <g transform="translate(110, 160)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#1e293b" stroke-width="10"/>
      <circle cx="0" cy="0" r="54" fill="none" stroke="#f97316" stroke-width="10" stroke-dasharray="270" stroke-dashoffset="80" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="5" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">72%</text>
      <text x="0" y="22" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">REMAINING</text>
    </g>

    <!-- Bottom Action Pill -->
    <rect x="16" y="240" width="188" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="110" y="263" fill="#f8fafc" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">立即续期 ➔</text>
  </g>

  <!-- Card 3: Flip Card & Drag Sheet Preview -->
  <g transform="translate(540, 145)">
    <rect width="220" height="295" rx="18" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="18" rx="4" fill="#a855f7" fill-opacity="0.15"/>
    <text x="51" y="29" fill="#a855f7" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">PERSP 1200</text>
    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">点击翻面凭证</text>
    <text x="16" y="72" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="10">Flip Card · 原地180°核销</text>

    <!-- QR Code Mockup Graphic -->
    <g transform="translate(38, 95)">
      <rect width="144" height="130" rx="10" fill="#0f172a" stroke="#334155"/>
      <rect x="18" y="18" width="30" height="30" fill="#f8fafc"/>
      <rect x="23" y="23" width="20" height="20" fill="#0f172a"/>
      <rect x="96" y="18" width="30" height="30" fill="#f8fafc"/>
      <rect x="101" y="23" width="20" height="20" fill="#0f172a"/>
      <rect x="18" y="82" width="30" height="30" fill="#f8fafc"/>
      <rect x="23" y="87" width="20" height="20" fill="#0f172a"/>
      <line x1="58" y1="25" x2="88" y2="25" stroke="#f8fafc" stroke-width="4"/>
      <line x1="58" y1="40" x2="80" y2="40" stroke="#f97316" stroke-width="4"/>
      <line x1="60" y1="90" x2="110" y2="90" stroke="#f8fafc" stroke-width="4"/>
      <line x1="60" y1="102" x2="95" y2="102" stroke="#f8fafc" stroke-width="4"/>
    </g>

    <!-- Bottom Action Pill -->
    <rect x="16" y="240" width="188" height="36" rx="18" fill="#a855f7"/>
    <text x="110" y="263" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">翻转出示核销码 ↺</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="20" fill="url(#bg04)"/>
  <rect x="1" y="1" width="798" height="478" rx="19" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Category Header Badge -->
  <rect x="40" y="36" width="104" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="92" y="53" fill="#10b981" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">CATEGORY 04</text>
  
  <text x="40" y="92" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="800">触觉手势交互与高级提示 · 6款原生微动效</text>
  <text x="40" y="116" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="13">WXS 60fps 左右切卡 · 裂变流体胶囊按钮 · 4秒倒计时撤销条 · 原位弧线消散红点</text>

  <!-- Card 1: Swipe Card Stack Mockup -->
  <g transform="translate(40, 145)">
    <rect width="220" height="295" rx="18" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="74" height="18" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="53" y="29" fill="#10b981" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">SWIPE 60FPS</text>

    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">左右滑动卡片堆叠</text>
    <text x="16" y="72" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="10">Swipe Stack · WXS阻尼</text>

    <!-- Swiping cards diagram -->
    <g transform="translate(20, 95)">
      <!-- Under card (scale 0.94) -->
      <rect x="10" y="10" width="160" height="100" rx="12" fill="#0f172a" stroke="#334155"/>
      <!-- Top card tilted -->
      <g transform="rotate(8, 90, 60)">
        <rect x="10" y="10" width="160" height="100" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
        <text x="30" y="45" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="800">Hill cabin</text>
        <text x="30" y="65" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9">4 NIGHTS · 心动</text>
        <circle cx="140" cy="50" r="16" fill="#10b981" fill-opacity="0.2"/>
        <text x="140" y="55" fill="#10b981" font-size="14" text-anchor="middle">♥</text>
      </g>
    </g>

    <rect x="16" y="240" width="188" height="36" rx="18" fill="#059669"/>
    <text x="110" y="263" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">左右滑牌切卡 ➔</text>
  </g>

  <!-- Card 2: Split Button Morph Mockup -->
  <g transform="translate(290, 145)">
    <rect width="220" height="295" rx="18" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="76" height="18" rx="4" fill="#f97316" fill-opacity="0.15"/>
    <text x="54" y="29" fill="#f97316" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">SPLIT MORPH</text>

    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">裂变流体胶囊按键</text>
    <text x="16" y="72" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="10">Split Button · 一分为二形变</text>

    <!-- Timer display -->
    <text x="110" y="130" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">02:45</text>
    <text x="110" y="152" fill="#f97316" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RUNNING · 进行中</text>

    <!-- Split twins buttons -->
    <g transform="translate(20, 175)">
      <rect x="0" y="0" width="84" height="36" rx="18" fill="#f97316"/>
      <text x="42" y="23" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Pause ❚❚</text>
      <rect x="96" y="0" width="84" height="36" rx="18" fill="#ef4444"/>
      <text x="138" y="23" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">End ◼</text>
    </g>

    <rect x="16" y="240" width="188" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
    <text x="110" y="263" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">体验胶囊裂变 ⚯</text>
  </g>

  <!-- Card 3: Undo Timer Bar Mockup -->
  <g transform="translate(540, 145)">
    <rect width="220" height="295" rx="18" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="60" height="18" rx="4" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="46" y="29" fill="#3b82f6" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">UNDO 4.0s</text>

    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">倒计时进度撤销条</text>
    <text x="16" y="72" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="10">Undo Timer · 防手滑后悔</text>

    <!-- Task list item -->
    <g transform="translate(16, 95)">
      <rect width="188" height="45" rx="10" fill="#0f172a" stroke="#27272a"/>
      <circle cx="20" cy="22" r="6" fill="#3b82f6"/>
      <text x="35" y="26" fill="#e2e8f0" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600">Swap the H5 cover</text>
      <text x="168" y="27" fill="#ef4444" font-size="14" font-weight="700">×</text>
    </g>

    <!-- Floating Undo bar -->
    <g transform="translate(16, 160)">
      <rect width="188" height="52" rx="12" fill="#18181b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f1f5f9" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600">1 项任务已移除</text>
      <rect x="125" y="12" width="50" height="24" rx="12" fill="#38bdf8"/>
      <text x="150" y="28" fill="#0f172a" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">撤销</text>
      <!-- Countdown progress track line -->
      <line x1="10" y1="46" x2="178" y2="46" stroke="#27272a" stroke-width="3"/>
      <line x1="10" y1="46" x2="115" y2="46" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <rect x="16" y="240" width="188" height="36" rx="18" fill="#2563eb"/>
    <text x="110" y="263" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">测试 4秒 撤销反悔 ↺</text>
  </g>
</svg>

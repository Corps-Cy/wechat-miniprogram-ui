<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#06080e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff3e00"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      /* CSS Keyframe Animations */
      @keyframes floatCard {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes ringProgress {
        0% { stroke-dashoffset: 339; }
        50%, 80% { stroke-dashoffset: 85; }
        100% { stroke-dashoffset: 339; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      @keyframes flip3D {
        0%, 40% { transform: rotateY(0deg); }
        50%, 90% { transform: rotateY(180deg); }
        100% { transform: rotateY(0deg); }
      }
      @keyframes staggerBars {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      @keyframes shineSweep {
        0% { transform: translateX(-150px) skewX(-20deg); }
        40%, 100% { transform: translateX(260px) skewX(-20deg); }
      }

      .floating-card { animation: floatCard 4s ease-in-out infinite; }
      .ring-anim {
        stroke-dasharray: 339;
        stroke-dashoffset: 339;
        animation: ringProgress 4s cubic-bezier(0.2, 0.7, 0.2, 1) infinite;
        transform-origin: center;
      }
      .glow-anim { animation: pulseGlow 3s ease-in-out infinite; }
      .flip-container {
        transform-style: preserve-3d;
        transform-origin: 110px 150px;
        animation: flip3D 6s cubic-bezier(0.4, 0.2, 0.2, 1) infinite;
      }
      .shine-beam {
        animation: shineSweep 4s ease-in-out infinite;
      }
      .bar-fill {
        transform-origin: bottom;
        animation: staggerBars 3s ease-in-out infinite;
      }
      .bar-1 { animation-delay: 0.1s; }
      .bar-2 { animation-delay: 0.25s; }
      .bar-3 { animation-delay: 0.4s; }
      .bar-4 { animation-delay: 0.55s; }
      .bar-5 { animation-delay: 0.7s; }
      .bar-6 { animation-delay: 0.85s; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="840" height="500" rx="20" fill="url(#bg01)"/>
  <rect x="1" y="1" width="838" height="498" rx="19" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Category Title Header -->
  <g transform="translate(40, 36)">
    <rect width="112" height="26" rx="13" fill="#ff7a00" fill-opacity="0.15" stroke="#ff7a00" stroke-opacity="0.35"/>
    <text x="56" y="17" fill="#ff7a00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">CATEGORY 01</text>
    
    <text x="0" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">凭证与卡券流体弹层 · 原生微动效</text>
    <text x="0" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">26px 毛玻璃浮起 · 1.2s 顺时针圆环递增 · 180° 原地翻面核销 · 虚线齿孔下拉小票</text>
  </g>

  <!-- ================= CARD 1: Frosted Glass Sheet ================= -->
  <g transform="translate(40, 150)" class="floating-card">
    <!-- Card Base -->
    <rect width="230" height="310" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="20" rx="5" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="51" y="30" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">BLUR 26px</text>
    <text x="16" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">玻璃面板浮起</text>
    <text x="16" y="78" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">frosted-glass-sheet</text>

    <!-- Stat Counter -->
    <text x="16" y="132" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="44" font-weight="900">163</text>
    <text x="105" y="118" fill="#ff7a00" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">天剩余</text>
    <text x="16" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">年度会员打卡权益流</text>

    <!-- Animated Staggered Progress Bars -->
    <g transform="translate(16, 172)">
      <rect x="0" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect class="bar-fill bar-1" x="0" y="6" width="12" height="40" rx="6" fill="#ff7a00"/>
      
      <rect x="16" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect class="bar-fill bar-2" x="16" y="14" width="12" height="32" rx="6" fill="#ff7a00"/>

      <rect x="32" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect class="bar-fill bar-3" x="32" y="4" width="12" height="42" rx="6" fill="#ff7a00"/>

      <rect x="48" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect class="bar-fill bar-4" x="48" y="18" width="12" height="28" rx="6" fill="#ff7a00"/>

      <rect x="64" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect class="bar-fill bar-5" x="64" y="2" width="12" height="44" rx="6" fill="#ff7a00"/>

      <rect x="80" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect class="bar-fill bar-6" x="80" y="10" width="12" height="36" rx="6" fill="#ff7a00"/>

      <rect x="96" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect x="112" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect x="128" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect x="144" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect x="160" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
      <rect x="176" y="0" width="12" height="46" rx="6" fill="#1e293b"/>
    </g>

    <!-- Bottom Button -->
    <rect x="16" y="252" width="198" height="38" rx="19" fill="url(#orangeGrad)"/>
    <text x="115" y="276" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">查看行程打卡 ➔</text>
  </g>

  <!-- ================= CARD 2: Ring Count Sheet ================= -->
  <g transform="translate(305, 150)">
    <rect width="230" height="310" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="76" height="20" rx="5" fill="#ff7a00" fill-opacity="0.15"/>
    <text x="54" y="30" fill="#ff7a00" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">RING 1.2s</text>
    <text x="16" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">圆环计数弹出</text>
    <text x="16" y="78" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">ring-count-sheet</text>

    <!-- Circular Progress Ring (Animated) -->
    <g transform="translate(115, 162)">
      <!-- Track Ring -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#1e293b" stroke-width="10"/>
      <!-- Animated Progress Circle -->
      <circle class="ring-anim" cx="0" cy="0" r="54" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round" transform="rotate(-90)" filter="url(#glowOrange)"/>
      <circle class="ring-anim" cx="0" cy="0" r="54" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="6" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="30" font-weight="900" text-anchor="middle">75%</text>
      <text x="0" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PROGRESS</text>
    </g>

    <!-- Bottom Button -->
    <rect x="16" y="252" width="198" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="115" y="276" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">顺时针吸附更新 ↺</text>
  </g>

  <!-- ================= CARD 3: Flip Card Sheet (3D Flip) ================= -->
  <g transform="translate(570, 150)">
    <g class="flip-container">
      <rect width="230" height="310" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <rect x="16" y="16" width="80" height="20" rx="5" fill="#c084fc" fill-opacity="0.15"/>
      <text x="56" y="30" fill="#c084fc" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">PERSP 1200</text>
      <text x="16" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">点击翻面凭证</text>
      <text x="16" y="78" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">flip-card-sheet</text>

      <!-- Ticket Details Front -->
      <g transform="translate(20, 105)">
        <rect width="190" height="125" rx="12" fill="#0b0f19" stroke="#334155" stroke-dasharray="4 4"/>
        <text x="16" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">VIP PASS VOUCHER</text>
        <text x="16" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="800">SVIP 黑金年卡</text>
        <text x="16" y="80" fill="#ff7a00" font-family="monospace" font-size="11" font-weight="700">NO. 8839-2026-X</text>
        <line x1="16" y1="95" x2="174" y2="95" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="112" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9">点击原地 180° 翻转出示</text>
        <circle cx="166" cy="110" r="4" fill="#10b981"/>
      </g>

      <!-- Bottom Button -->
      <rect x="16" y="252" width="198" height="38" rx="19" fill="url(#purpleGrad)"/>
      <text x="115" y="276" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">180° 原地翻面 ↻</text>
    </g>
  </g>
</svg>
